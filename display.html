<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV SHOW DISPLAY</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="tv-display-body">
    
    <div class="tv-main-container">
        <!-- Logo y Header superior -->
        <header class="tv-header">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b8/Banco_Santander_Logotipo.svg/1200px-Banco_Santander_Logotipo.svg.png" class="tv-logo">
        </header>

        <!-- Área Central de Pregunta -->
        <main class="tv-stage">
            <div id="waiting-area" class="tv-waiting">
                <h2 class="pulse-slow">PREPAREN SUS DISPOSITIVOS</h2>
            </div>
            
            <div id="question-area" class="tv-question-box hidden">
                <div class="tv-diamond-frame">
                    <h1 id="display-question-text">¿LISTOS PARA EMPEZAR?</h1>
                </div>
            </div>
        </main>

        <!-- Footer Informativo -->
        <footer class="tv-footer">
            <div class="tv-status-pill">SISTEMA EN LÍNEA</div>
        </footer>
    </div>

    <!-- POP-UP ESPECTACULAR -->
    <div id="winner-popup" class="tv-popup-overlay hidden">
        <div class="tv-popup-card">
            <div class="popup-header">¡TURNO DE RESPUESTA!</div>
            <div id="winner-name" class="popup-name">NOMBRE</div>
            <div class="popup-glow"></div>
        </div>
    </div>

    <script type="module" src="display.js"></script>
</body>
</html>
