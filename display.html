<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <title>DISPLAY</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <link rel="stylesheet" href="style.css">

</head>
<body class="displayBody">

<div class="displayContainer">

  <div class="displayLabel">
    PREGUNTA
  </div>

  <div
    id="displayQuestion"
    class="displayQuestion"
  >
    Esperando pregunta...
  </div>

  <div
    id="displayStatus"
    class="displayStatus"
  >
    Estado
  </div>

</div>

<div
  id="winnerPopup"
  class="winnerPopup hidden"
>

  <div class="popupContent">

    <div class="popupTitle">
      🚨 RESPONDE 🚨
    </div>

    <div
      id="popupWinner"
      class="popupWinner"
    >
      Nombre
    </div>

  </div>

</div>

<script type="module" src="display.js"></script>

</body>
</html>
