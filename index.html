<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Santander - Jugador</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="player-body">
    <!-- Mitad Superior: Pregunta -->
    <div class="top-section">
        <div class="question-frame">
            <div id="status-message" class="pulse">ESPERANDO...</div>
            <div id="question-text" class="hidden"></div>
        </div>
    </div>

    <!-- Mitad Inferior: Botón -->
    <div class="bottom-section">
        <div id="login-screen" class="login-overlay active">
            <div class="login-box">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b8/Banco_Santander_Logotipo.svg/1200px-Banco_Santander_Logotipo.svg.png" class="mini-logo">
                <input type="text" id="player-name" placeholder="Tu Nombre" autocomplete="off">
                <button id="join-btn" class="btn-primary">ENTRAR</button>
            </div>
        </div>
        
        <button id="buzzer-btn" class="buzzer-massive disabled" disabled>
            <div class="buzzer-inner">
                <span id="buzzer-label">ESPERA</span>
            </div>
        </button>
        <div id="result-message" class="result-label hidden"></div>
    </div>

    <script type="module" src="player.js"></script>
</body>
</html>
