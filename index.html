<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Santander - Jugador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
    
<body class="player-body text-white">
    <div class="bg-overlay d-flex flex-column h-100">

        <div id="login-modal" class="custom-modal-overlay">
            <div class="custom-popup-box glow-box">
                <h2 class="popup-title">INGRESA PARA JUGAR</h2>
                <div class="mb-3 text-start">
                    <input type="text" id="player-name" class="custom-input text-center fs-3 py-3" placeholder="Tu Nombre" autocomplete="off">
                </div>
                <button id="join-btn" class="custom-btn-siguiente w-100">SIGUIENTE</button>
            </div>
        </div>

        <div id="main-player-ui" class="d-none h-100 flex-column">
            <div class="player-header p-3 text-center d-flex flex-column justify-content-center">
                <div id="status-message" class="pulse fw-bold text-secondary fs-3">ESPERANDO...</div>
                <h3 id="question-text" class="d-none fw-bold text-white mb-3 mt-2"></h3>
                
                <div id="timer-bar-container" class="w-100 bg-dark rounded-pill overflow-hidden d-none glow-box" style="height: 12px; border:1px solid var(--santander-red);">
                    <div id="timer-bar-fill" class="bg-danger h-100 w-100" style="transition: width 0.1s linear;"></div>
                </div>
                <div id="time-left-text" class="fw-bold mt-1 text-danger d-none fs-4">10.0s</div>
            </div>

            <div class="player-options flex-grow-1 p-3" style="perspective: 800px;">
                <div id="options-grid" class="row h-100 g-3" style="transition: transform 0.1s ease-out; transform-style: preserve-3d;">
                    <div class="col-6 h-50"><button class="opt-btn w-100 h-100" data-opt="A"><span class="opt-letter">A</span><span class="opt-text" id="p-opt-A"></span></button></div>
                    <div class="col-6 h-50"><button class="opt-btn w-100 h-100" data-opt="B"><span class="opt-letter">B</span><span class="opt-text" id="p-opt-B"></span></button></div>
                    <div class="col-6 h-50"><button class="opt-btn w-100 h-100" data-opt="C"><span class="opt-letter">C</span><span class="opt-text" id="p-opt-C"></span></button></div>
                    <div class="col-6 h-50"><button class="opt-btn w-100 h-100" data-opt="D"><span class="opt-letter">D</span><span class="opt-text" id="p-opt-D"></span></button></div>
                </div>
            </div>
            <div id="feedback-bar" class="d-none"></div>
        </div>

        <div id="souvenir-screen" class="d-none h-100 d-flex align-items-center justify-content-center p-3" style="z-index: 9999; position: relative;">
            <div class="souvenir-card glow-box bg-dark p-4 rounded text-center w-100" style="border: 4px solid var(--santander-red); max-width: 400px; aspect-ratio: 2/3;">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b8/Banco_Santander_Logotipo.svg/1200px-Banco_Santander_Logotipo.svg.png" width="150" class="mb-4">
                <h2 class="text-danger fw-black text-uppercase mb-1" id="sov-name">NOMBRE</h2>
                <h5 class="text-secondary mb-4">ESTADÍSTICAS OFICIALES</h5>
                <div class="d-flex justify-content-between mb-3 border-bottom border-secondary pb-2">
                    <span class="fs-5">Respuestas Correctas:</span>
                    <span class="fs-4 fw-bold text-warning" id="sov-correct">0</span>
                </div>
                <div class="d-flex justify-content-between mb-4 border-bottom border-secondary pb-2">
                    <span class="fs-5">Mejor Reacción:</span>
                    <span class="fs-4 fw-bold text-success" id="sov-time">0.0s</span>
                </div>
                <div class="mt-4 p-3 bg-white rounded d-inline-block"><div id="qrcode"></div></div>
                <p class="mt-3 text-muted small">Muestra este código en la estación fotográfica.</p>
            </div>
        </div>
    </div>
    <script type="module" src="player.js"></script>
</body>
</html>
