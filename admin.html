<!DOCTYPE html>
<html lang="es">
<head>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"

  <link rel="stylesheet" href="style.css">

</head>
<body>

<div class="adminContainer">

  <h1>🎛️ PANEL ADMIN</h1>

  <div id="gameStatus" class="gameStatus">

  </div>

  <div id="adminQuestion" class="adminQuestion">
    Pregunta
  </div>

  </div>

  <div class="adminButtons">

    <button id="nextBtn">

    <button id="enableBtn">
      HABILITAR BUZZERS

    <button id="disableBtn">
      BLOQUEAR BUZZERS

      RESET
    </button>

<script type="module" src="admin.js"></script>
