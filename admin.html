<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control - Santander TV Show</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-body">
    <div class="admin-container pb-5">
        <header class="admin-header">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b8/Banco_Santander_Logotipo.svg/1200px-Banco_Santander_Logotipo.svg.png" alt="Santander">
            <h1>CONTROL DE TRIVIA</h1>
        </header>
        
        <div class="panel-section">
            <h2>1. REDACTAR PREGUNTA</h2>
            <textarea id="question-input" placeholder="Ej: ¿En qué año se fundó...?" rows="2"></textarea>
            
            <h2 class="mt-4">2. ALTERNATIVAS (Marca la correcta)</h2>
            <div class="row g-3 mb-3">
                <div class="col-md-6 d-flex align-items-center">
                    <input class="form-check-input me-2 fs-4" type="radio" name="correctOpt" value="A" checked>
                    <input type="text" id="opt-A" class="form-control admin-opt-input" placeholder="Opción A">
                </div>
                <div class="col-md-6 d-flex align-items-center">
                    <input class="form-check-input me-2 fs-4" type="radio" name="correctOpt" value="B">
                    <input type="text" id="opt-B" class="form-control admin-opt-input" placeholder="Opción B">
                </div>
                <div class="col-md-6 d-flex align-items-center">
                    <input class="form-check-input me-2 fs-4" type="radio" name="correctOpt" value="C">
                    <input type="text" id="opt-C" class="form-control admin-opt-input" placeholder="Opción C">
                </div>
                <div class="col-md-6 d-flex align-items-center">
                    <input class="form-check-input me-2 fs-4" type="radio" name="correctOpt" value="D">
                    <input type="text" id="opt-D" class="form-control admin-opt-input" placeholder="Opción D">
                </div>
            </div>
        </div>

        <div class="panel-section">
            <h2>3. FLUJO DEL JUEGO</h2>
            <div class="d-flex flex-column gap-3">
                <button id="btn-launch" class="btn-success py-3 text-uppercase fs-4">1. LANZAR PREGUNTA (10 SEGUNDOS)</button>
                <button id="btn-reveal" class="btn-primary py-3 text-uppercase fs-4">2. REVELAR CORRECTA Y GANADOR</button>
                <button id="btn-lobby" class="btn-danger py-3 text-uppercase mt-4">REINICIAR A LOBBY</button>
            </div>
        </div>

        <div class="panel-section status-board">
            <h2>ESTADO ACTUAL: <span id="current-status" class="badge bg-warning text-dark ms-2">LOBBY</span></h2>
            <div id="admin-winner-box" class="d-none mt-3 p-3 bg-dark border border-danger rounded text-center">
                <h3 class="text-white">GANADOR MÁS RÁPIDO:</h3>
                <h1 id="admin-winner-name" class="text-danger fw-bold m-0">---</h1>
            </div>
        </div>
    </div>
    <script type="module" src="admin.js"></script>
</body>
</html>
