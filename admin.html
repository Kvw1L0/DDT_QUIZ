<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Trivia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-body">
    <div class="admin-container pb-5">
        <header class="admin-header d-flex justify-content-between align-items-center mt-4 border-bottom border-secondary pb-3 mb-4">
            <div class="d-flex align-items-center">
                
                <h1 class="m-0 text-white fw-bold">CONTROL TRIVIA</h1>
            </div>
            <button id="btn-nueva-sesion" class="btn btn-danger btn-lg fw-black border border-light border-3 pulse">🚨 NUEVA SESIÓN (RESET TOTAL) 🚨</button>
        </header>
        
        <div class="panel-section">
            <h2>1. REDACTAR PREGUNTA</h2>
            <textarea id="question-input" class="form-control admin-opt-input mb-4" rows="2"></textarea>
            
            <h2>2. ALTERNATIVAS (Marca correcta)</h2>
            <div class="row g-3">
                <div class="col-md-6 d-flex align-items-center"><input class="form-check-input me-2 fs-4" type="radio" name="correctOpt" value="A" checked><input type="text" id="opt-A" class="form-control admin-opt-input"></div>
                <div class="col-md-6 d-flex align-items-center"><input class="form-check-input me-2 fs-4" type="radio" name="correctOpt" value="B"><input type="text" id="opt-B" class="form-control admin-opt-input"></div>
                <div class="col-md-6 d-flex align-items-center"><input class="form-check-input me-2 fs-4" type="radio" name="correctOpt" value="C"><input type="text" id="opt-C" class="form-control admin-opt-input"></div>
                <div class="col-md-6 d-flex align-items-center"><input class="form-check-input me-2 fs-4" type="radio" name="correctOpt" value="D"><input type="text" id="opt-D" class="form-control admin-opt-input"></div>
            </div>
        </div>

        <div class="panel-section">
            <h2>3. FLUJO DEL JUEGO</h2>
            <div class="d-flex flex-column gap-3 mt-3">
                <button id="btn-launch" class="btn btn-success py-3 text-uppercase fs-5 fw-bold">1. LANZAR PREGUNTA (10s)</button>
                <button id="btn-reveal" class="btn btn-primary py-3 text-uppercase fs-5 fw-bold">2. REVELAR Y ASIGNAR PUNTOS</button>
                <hr class="border-secondary my-2">
                <button id="btn-lobby" class="btn btn-secondary py-3 text-uppercase fw-bold fs-6">➡️ SIGUIENTE PREGUNTA (VOLVER A LOBBY)</button>
                <button id="btn-ranking" class="btn btn-warning py-3 text-uppercase fs-5 fw-bold mt-2">🌟 VER RANKING PARCIAL 🌟</button>
                <hr class="border-danger my-3 border-2 opacity-50">
                <button id="btn-endgame" class="btn btn-danger py-4 text-uppercase fs-4 fw-black">🛑 TERMINAR JUEGO (ENTREGAR QR)</button>
            </div>
        </div>

        <div class="panel-section status-board">
            <h2>ESTADO: <span id="current-status" class="badge bg-warning text-dark ms-2">LOBBY</span></h2>
            <div id="admin-winner-box" class="d-none mt-3 p-3 bg-dark border border-danger rounded text-center">
                <h3 class="text-white">GANADOR DE LA RONDA:</h3>
                <h1 id="admin-winner-name" class="text-danger fw-bold m-0">---</h1>
            </div>
        </div>
    </div>
    <script type="module" src="admin.js"></script>
</body>
</html>
