<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administrador</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-body">
    <div class="admin-container">
        <h1>Panel de Control</h1>
        
        <div class="panel-section">
            <h2>1. Configurar Pregunta</h2>
            <textarea id="question-input" placeholder="Escribe la pregunta aquí..." rows="3"></textarea>
            <button id="send-question-btn" class="btn-primary">Enviar Pregunta (Bloqueada)</button>
        </div>

        <div class="panel-section">
            <h2>2. Controles de Botonera</h2>
            <div class="btn-group">
                <button id="enable-btn" class="btn-success">HABILITAR BOTONES</button>
                <button id="reset-btn" class="btn-danger">Reiniciar a Lobby</button>
            </div>
        </div>

        <div class="panel-section status-board">
            <h2>Estado en Vivo</h2>
            <p>Fase actual: <span id="current-status" class="badge">lobby</span></p>
            <div id="winner-display" class="hidden"></div>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
